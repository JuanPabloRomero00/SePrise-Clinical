<body class="bg-light p-3">
    <div class="container">
        <!-- Reservar Turno -->
        <h3 class="mb-4">Reservar Turno</h3>
        <div class="card p-4">
            <form>
                <label class="form-label" for="selectPlan">Selecciona tu plan de salud:</label>
                <select class="form-select mb-2" id="selectPlan">
                    <option disabled selected value="">Elija un plan</option>
                    <option value="210">Plan individual</option>
                    <option value="310">Plan Familiar</option>
                    <option value="410">Particular</option>
                    <option value="510">Seprise frecuentes</option>
                    <option value="610">Seprise premium</option>
                </select>
                <div class="invalid-feedback"></div>

                <label class="form-label mt-3" for="selectEspecialidad">Especialidades:</label>
                <select class="form-select mb-2" id="selectEspecialidad">
                    <option disabled selected value="">Elija una especialidad</option>
                    <option value="Pediatría">Laboratorio General</option>
                    <option value="Oftalmología">Análisis de Sangre</option>
                    <option value="Odontología">Espermograma</option>
                    <option value="Traumatología">Celiaquía</option>
                    <option value="Cardiología">ADN prenatal</option>
                    <option value="Endocrinología">Covid-19</option>
                    <option value="Ginecología">Dengue</option>
                    <option value="Otorrinolaringología">Trombofilia</option>
                    <option value="Psiquiatría">Embarazo</option>
                    <option value="Dermatología">Cariotipos</option>
                </select>
                <div class="invalid-feedback"></div>

                <label class="form-label mt-3" for="fecha">Selecciona una fecha:</label>
                <input class="form-control mb-2" id="fecha" type="date" />
                <div class="invalid-feedback"></div>
            </form>

            <div class="d-none mt-4" id="bloqueHorarios">
                <label class="fw-bold mb-2">Horarios disponibles</label>
                <div class="d-flex flex-wrap gap-2 mb-2" id="horariosContainer"></div>
            </div>

            <div class="input-group d-none mt-3" id="botonContinuar">
                <button class="btn btn-outline-success" id="btnContinuar" type="button">Continuar</button>
            </div>

            <div class="alert alert-success mt-4 d-none" id="resumenTurno">
                <div id="contenidoResumen"></div>
                <button class="btn btn-sm btn-light mt-3" id="btnNuevoTurno">Reservar otro turno</button>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const selectPlan = document.getElementById("selectPlan");
                const selectEspecialidad = document.getElementById("selectEspecialidad");
                const inputFecha = document.getElementById("fecha");
                const horariosContainer = document.getElementById("horariosContainer");
                const bloqueHorarios = document.getElementById("bloqueHorarios");
                const botonContinuar = document.getElementById("botonContinuar");
                const btnContinuar = document.getElementById("btnContinuar");
                const resumenTurno = document.getElementById("resumenTurno");
                const contenidoResumen = document.getElementById("contenidoResumen");
                const btnNuevoTurno = document.getElementById("btnNuevoTurno");

                const hoy = new Date().toISOString().split("T")[0];
                inputFecha.setAttribute("min", hoy);

                selectPlan.addEventListener("change", () => selectPlan.classList.remove("is-invalid"));
                selectEspecialidad.addEventListener("change", () => selectEspecialidad.classList.remove("is-invalid"));
                inputFecha.addEventListener("change", () => inputFecha.classList.remove("is-invalid"));

                inputFecha.addEventListener("change", function () {
                    bloqueHorarios.classList.remove("d-none");
                    botonContinuar.classList.add("d-none");
                    generarHorariosAleatorios();
                });

                function generarHorariosAleatorios() {
                    horariosContainer.innerHTML = "";
                    const horariosDisponibles = [];
                    for (let h = 8; h < 18; h++) {
                        horariosDisponibles.push(h.toString().padStart(2, "0") + ":00");
                        horariosDisponibles.push(h.toString().padStart(2, "0") + ":30");
                    }

                    const horariosAleatorios = [...horariosDisponibles]
                        .sort(() => Math.random() - 0.5)
                        .slice(0, 6)
                        .sort();

                    horariosAleatorios.forEach((hora, index) => {
                        const id = "hora" + index;

                        const input = document.createElement("input");
                        input.type = "radio";
                        input.className = "btn-check";
                        input.name = "horario";
                        input.id = id;
                        input.autocomplete = "off";

                        const label = document.createElement("label");
                        label.className = "btn btn-outline-primary flex-fill text-center";
                        label.htmlFor = id;
                        label.textContent = hora;

                        input.addEventListener("change", function () {
                            botonContinuar.classList.remove("d-none");
                        });

                        horariosContainer.appendChild(input);
                        horariosContainer.appendChild(label);
                    });
                }

                btnContinuar.addEventListener("click", function () {
                    const plan = selectPlan.value;
                    const especialidad = selectEspecialidad.value;
                    const fecha = inputFecha.value;
                    const horarioRadio = document.querySelector("input[name='horario']:checked");
                    const horario = horarioRadio ? horarioRadio.nextElementSibling.textContent : null;

                    let errores = false;

                    if (!plan) {
                        selectPlan.classList.add("is-invalid");
                        errores = true;
                    }

                    if (!especialidad) {
                        selectEspecialidad.classList.add("is-invalid");
                        errores = true;
                    }

                    if (!fecha) {
                        inputFecha.classList.add("is-invalid");
                        errores = true;
                    }

                    if (!horario) {
                        errores = true;
                    }

                    if (errores) return;

                    contenidoResumen.innerHTML = `
            <strong>Turno confirmado</strong><br>
            Plan: ${plan}<br>
            Especialidad: ${especialidad}<br>
            Fecha: ${fecha}<br>
            Horario: ${horario}
        `;
                    resumenTurno.classList.remove("d-none");
                });

                btnNuevoTurno.addEventListener("click", function () {
                    selectPlan.value = "";
                    selectEspecialidad.value = "";
                    inputFecha.value = "";

                    selectPlan.classList.remove("is-invalid");
                    selectEspecialidad.classList.remove("is-invalid");
                    inputFecha.classList.remove("is-invalid");

                    horariosContainer.innerHTML = "";
                    bloqueHorarios.classList.add("d-none");
                    botonContinuar.classList.add("d-none");
                    resumenTurno.classList.add("d-none");

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        </script>
